<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName centralelyon-ia.com
    ServerAlias www.centralelyon-ia.com

    Timeout 120
    ProxyTimeout 120

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:8050/
    ProxyPassReverse / http://127.0.0.1:8050/

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always unset X-Powered-By
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error_centralelyon_ia.log
    CustomLog ${APACHE_LOG_DIR}/access_centralelyon_ia.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/centralelyon-ia.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/centralelyon-ia.com/privkey.pem
</VirtualHost>
</IfModule>
