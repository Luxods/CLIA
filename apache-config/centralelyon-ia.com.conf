<VirtualHost *:80>
    ServerName centralelyon-ia.com
    ServerAlias www.centralelyon-ia.com

    ErrorLog ${APACHE_LOG_DIR}/error_centralelyon_ia.log
    CustomLog ${APACHE_LOG_DIR}/access_centralelyon_ia.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.centralelyon-ia.com [OR]
    RewriteCond %{SERVER_NAME} =centralelyon-ia.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
